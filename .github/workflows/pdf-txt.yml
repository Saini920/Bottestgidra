name: pdf-to-txt
run-name: job-${{ github.event.client_payload.job_id }}
on:
  repository_dispatch:
    types: [pdf-to-txt]

permissions:
  actions: write
  contents: read

jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install poppler-utils + tesseract (Indian languages)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr \
            tesseract-ocr-hin tesseract-ocr-urd tesseract-ocr-ben \
            tesseract-ocr-mar tesseract-ocr-guj tesseract-ocr-tam \
            tesseract-ocr-tel tesseract-ocr-kan tesseract-ocr-mal \
            tesseract-ocr-pan
          pdftotext -v
          tesseract --version
          tesseract --list-langs

      - name: Install worker deps
        run: npm install

      - name: Run PDF → TXT worker
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: node workers/pdf-txt.js

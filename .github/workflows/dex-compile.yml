name: dex-compile
run-name: job-${{ github.event.client_payload.job_id }}
on:
  repository_dispatch:
    types: [dex-compile-smali, dex-compile-java]

permissions:
  actions: write
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get smali assembler
        run: |
          sudo curl -L --retry 3 -o /opt/smali.jar https://github.com/baksmali/smali/releases/download/3.0.9/smali-3.0.9-fat.jar
          printf '#!/bin/bash\nexec java -jar /opt/smali.jar "$@"\n' | sudo tee /usr/local/bin/smali >/dev/null
          sudo chmod +x /usr/local/bin/smali
          smali --version

      - name: Locate Android build-tools (d8 + android.jar)
        run: |
          set -e
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ] || [ ! -x "$BT/d8" ]; then
            echo "::error::Android build-tools not found on runner"
            exit 1
          fi
          echo "$BT" >> "$GITHUB_PATH"
          echo "Using build-tools: $BT"
          # GITHUB_PATH only affects the NEXT step, so verify with the full path
          "$BT/d8" --version
          ls /usr/local/lib/android/sdk/platforms | head -5

      - name: Install worker deps
        run: npm install

      - name: Run DEX Compile worker
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: node workers/dex-compile.js

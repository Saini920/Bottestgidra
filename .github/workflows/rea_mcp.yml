name: rea-mcp
run-name: mcp-${{ github.event.client_payload.chat_id }}-${{ github.event.client_payload.message_id }}

on:
  repository_dispatch:
    types: [rea-mcp]
  workflow_dispatch:
    inputs:
      chat_id:
        description: 'Telegram Chat ID'
        required: true
      message_id:
        description: 'Telegram Message ID'
        required: false
      filename:
        description: 'Target Binary Filename'
        required: false

permissions:
  actions: write
  contents: read

jobs:
  mcp-session:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Ghidra
        id: ghidra-cache
        uses: actions/cache@v4
        with:
          path: /opt/ghidra
          key: ghidra-11.3.2-v1

      - name: Get Ghidra
        if: steps.ghidra-cache.outputs.cache-hit != 'true'
        run: |
          if [ -f /opt/ghidra/support/analyzeHeadless ]; then
            echo "Ghidra already valid at /opt/ghidra"
            exit 0
          fi
          if [ -d /opt/ghidra ]; then
            echo "Removing stale cache layout"
            sudo rm -rf /opt/ghidra
          fi
          curl -L --retry 3 -o /tmp/ghidra.zip \
            "https://github.com/NationalSecurityAgency/ghidra/releases/download/Ghidra_11.3.2_build/ghidra_11.3.2_PUBLIC_20250415.zip"
          sudo unzip -q -o /tmp/ghidra.zip -d /opt
          ghdir=$(sudo bash -c 'ls -d /opt/ghidra_* 2>/dev/null | head -n1')
          echo "extracted dir: $ghdir"
          sudo mv "$ghdir" /opt/ghidra
          test -f /opt/ghidra/support/analyzeHeadless
          echo "Ghidra ready"
          rm -f /tmp/ghidra.zip

      - name: Ensure Ghidra REA Compatibility
        run: |
          if [ -f /opt/ghidra/Ghidra/application.properties ]; then
            sudo sed -i 's/^application.version=.*/application.version=12.1.4/' /opt/ghidra/Ghidra/application.properties || true
            echo "Ghidra version patched to 12.1.4 for REA compatibility"
          fi

      - name: Install Cloudflared & Reverse Engineering Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq apktool || true

          # Install Rizin static binary
          curl -fsSL https://github.com/rizinorg/rizin/releases/download/v0.9.1/rizin-v0.9.1-static-x86_64.tar.xz | sudo tar -xJ -C /usr/local || true
          rizin -v || /usr/local/rizin -v || echo "Rizin ready"

          # Install Cloudflared
          curl -fsSL -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb || sudo apt-get install -f -y
          rm -f /tmp/cloudflared.deb
          cloudflared --version

          # Install JADX decompiler
          sudo mkdir -p /opt/jadx
          curl -fsSL -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          sudo unzip -q -o /tmp/jadx.zip -d /opt/jadx
          sudo chmod +x /opt/jadx/bin/jadx
          sudo ln -sf /opt/jadx/bin/jadx /usr/local/bin/jadx
          rm -f /tmp/jadx.zip
          jadx --version || echo "JADX ready"

      - name: Install REA Agents Globally via npm
        run: |
          sudo npm install -g rea-agents
          rea --version || echo "REA ready"

      - name: Run REA MCP Worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ github.event.client_payload.bot_token || secrets.TELEGRAM_BOT_TOKEN }}
          PAYLOAD_FILE_URL: ${{ github.event.client_payload.file_url }}
          PAYLOAD_TG_FILE_PATH: ${{ github.event.client_payload.tg_file_path }}
          PAYLOAD_CHAT_ID: ${{ github.event.client_payload.chat_id || github.event.inputs.chat_id }}
          PAYLOAD_MESSAGE_ID: ${{ github.event.client_payload.message_id || github.event.inputs.message_id }}
          PAYLOAD_ORIGINAL_MESSAGE_ID: ${{ github.event.client_payload.original_message_id }}
          PAYLOAD_FILENAME: ${{ github.event.client_payload.filename || github.event.inputs.filename }}
          PAYLOAD_JOB_ID: ${{ github.event.client_payload.job_id }}
          PAYLOAD_IS_ADMIN: ${{ github.event.client_payload.is_admin }}
          GHIDRA_HOME: /opt/ghidra
          GHIDRA_INSTALL_DIR: /opt/ghidra
          MCP_COMMAND: "npx"
          MCP_ARGS: "-y rea-agents mcp"
          SESSION_TIMEOUT_MINUTES: "120"
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q httpx
          /tmp/venv/bin/python worker_rea_mcp.py

      - name: Report Failure to Telegram
        if: failure()
        env:
          BOT_TOKEN: ${{ github.event.client_payload.bot_token || secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id || github.event.inputs.chat_id }}
          MESSAGE_ID: ${{ github.event.client_payload.message_id || github.event.inputs.message_id }}
        run: |
          python3 - <<'PYEOF'
          import os, json, urllib.request
          token = os.environ.get("BOT_TOKEN")
          chat_id = os.environ.get("CHAT_ID")
          msg_id = os.environ.get("MESSAGE_ID")
          if token and chat_id:
              data = {
                  "chat_id": chat_id,
                  "text": "❌ <b>REA MCP Session Failed!</b>\nWorkflow runner encountered an unexpected error during setup.",
                  "parse_mode": "HTML"
              }
              if msg_id:
                  data["message_id"] = int(msg_id)
                  url = f"https://api.telegram.org/bot{token}/editMessageText"
              else:
                  url = f"https://api.telegram.org/bot{token}/sendMessage"
              try:
                  req = urllib.request.Request(
                      url,
                      data=json.dumps(data).encode("utf-8"),
                      headers={"Content-Type": "application/json"}
                  )
                  urllib.request.urlopen(req, timeout=10)
              except Exception as e:
                  print("Telegram notify error:", e)
          PYEOF

name: decompile-dex2jar
run-name: dex2jar-${{ github.event.client_payload.chat_id }}-${{ github.event.client_payload.message_id }}
on:
  repository_dispatch:
    types: [decompile-dex2jar]

permissions:
  actions: write
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache dex2jar + CFR
        id: dx-cache
        uses: actions/cache@v4
        with:
          path: |
            /opt/dex2jar
            /opt/cfr.jar
          key: dex2jar-cfr-v2

      - name: Get dex2jar
        if: steps.dx-cache.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /opt/dex2jar
          sudo mkdir -p /opt/dex2jar
          curl -L -o /tmp/dex2jar.zip https://github.com/pxb1988/dex2jar/releases/download/v2.4/dex-tools-v2.4.zip
          sudo unzip -q -o /tmp/dex2jar.zip -d /tmp/dx
          libdir=$(sudo bash -c 'find /tmp/dx -maxdepth 3 -type d -name lib | head -n1')
          echo "libdir: $libdir"
          sudo cp -r "$libdir" /opt/dex2jar/lib
          ls /opt/dex2jar/lib
          test -f /opt/dex2jar/lib/dex-tools-v2.4.jar
          echo "dex2jar ready"

      - name: Get CFR
        if: steps.dx-cache.outputs.cache-hit != 'true'
        run: |
          sudo curl -L -o /opt/cfr.jar https://github.com/leibnitz27/cfr/releases/download/0.152/cfr-0.152.jar
          test -f /opt/cfr.jar
          echo "CFR ready"

      - name: Cache TG Session
        uses: actions/cache@v4
        with:
          path: /opt/tg_sessions
          key: tg-session-v1

      - name: Prepare session dir
        run: |
          sudo mkdir -p /opt/tg_sessions
          sudo chown -R $(whoami) /opt/tg_sessions

      - name: Run dex2jar worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ github.event.client_payload.bot_token || secrets.TELEGRAM_BOT_TOKEN }}
          PAYLOAD_FILE_URL: ${{ github.event.client_payload.file_url }}
          PAYLOAD_TG_FILE_PATH: ${{ github.event.client_payload.tg_file_path }}
          PAYLOAD_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          PAYLOAD_MESSAGE_ID: ${{ github.event.client_payload.message_id }}
          PAYLOAD_ORIGINAL_MESSAGE_ID: ${{ github.event.client_payload.original_message_id }}
          PAYLOAD_FILENAME: ${{ github.event.client_payload.filename }}
          PAYLOAD_JOB_ID: ${{ github.event.client_payload.job_id }}
          PAYLOAD_IS_ADMIN: ${{ github.event.client_payload.is_admin }}
          PAYLOAD_FILE_ID: ${{ github.event.client_payload.file_id }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}

        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q httpx pyrogram tgcrypto
          /tmp/venv/bin/python worker_dex2jar.py

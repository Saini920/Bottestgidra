name: apk-source-build
run-name: apkbuild-${{ github.event.client_payload.chat_id }}-${{ github.event.client_payload.message_id }}
on:
  repository_dispatch:
    types: [apk-source-build]

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        run: |
          set -e
          if [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            echo "SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          elif [ -d /usr/local/lib/android/sdk ]; then
            echo "SDK_ROOT=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          elif [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            echo "SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          else
            echo "SDK_ROOT=$HOME/Android/Sdk" >> "$GITHUB_ENV"
          fi
          echo "Using SDK at: $SDK_ROOT"

      - name: Ensure SDK platform + build-tools
        run: |
          set -e
          FOUND=0
          if [ -d "$SDK_ROOT/platforms" ] && [ -n "$(ls "$SDK_ROOT/platforms" 2>/dev/null | grep -E '^android-[0-9]+$' | head -1)" ]; then
            FOUND=1
          fi
          if [ "$FOUND" = "0" ]; then
            echo "Installing platforms;android-34 + build-tools;34.0.0 ..."
            yes | "$SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"
          fi
          echo "Platforms: $(ls "$SDK_ROOT/platforms" 2>/dev/null | grep -E '^android-[0-9]+$' | tr '\n' ' ')"
          echo "Build-tools: $(ls "$SDK_ROOT/build-tools" 2>/dev/null | tr '\n' ' ')"

      - name: Locate Android NDK
        run: |
          set -e
          if [ -n "$ANDROID_NDK_LATEST_HOME" ] && [ -d "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
            echo "NDK_BIN=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
          elif [ -n "$ANDROID_NDK_HOME" ] && [ -d "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" ]; then
            echo "NDK_BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_ENV"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT/ndk" ]; then
            NDK_DIR=$(ls -d "$ANDROID_SDK_ROOT"/ndk/*/toolchains/llvm/prebuilt/linux-x86_64/bin 2>/dev/null | sort | tail -1)
            if [ -n "$NDK_DIR" ]; then
              echo "NDK_BIN=$NDK_DIR" >> "$GITHUB_ENV"
            fi
          fi
          if [ -z "$NDK_BIN" ]; then
            echo "::warning::Android NDK not found, worker will auto-locate"
          else
            echo "Using NDK at: $NDK_BIN"
          fi

      - name: Setup Gradle Environment & Licenses (Gradle Build)
        if: ${{ github.event.client_payload.build_type == 'gradle' }}
        run: |
          echo "Setting up Gradle build environment..."
          mkdir -p "$HOME/.android"
          mkdir -p "$SDK_ROOT/licenses"
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$SDK_ROOT/licenses/android-sdk-license" 2>/dev/null || true
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > "$SDK_ROOT/licenses/android-sdk-preview-license" 2>/dev/null || true
          echo "d56f5187479edd81e388891d122210e3785b9b8b" >> "$SDK_ROOT/licenses/android-sdk-license" 2>/dev/null || true
          echo "89388d6beac7883ba64e2173491f6a9f56730f13" >> "$SDK_ROOT/licenses/android-sdk-license" 2>/dev/null || true
          yes | "$SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          echo "GRADLE_USER_HOME=$HOME/.gradle" >> "$GITHUB_ENV"

      - name: Cache Gradle packages (Gradle Build)
        if: ${{ github.event.client_payload.build_type == 'gradle' }}
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-cache-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            gradle-cache-${{ runner.os }}-

      - name: Cache R8/D8 (Manual Build)
        if: ${{ github.event.client_payload.build_type != 'gradle' }}
        id: r8-cache
        uses: actions/cache@v4
        with:
          path: /opt/r8.jar
          key: r8-8.3.37

      - name: Get R8/D8 (Manual Build)
        if: ${{ github.event.client_payload.build_type != 'gradle' && steps.r8-cache.outputs.cache-hit != 'true' }}
        run: |
          sudo curl -L -o /opt/r8.jar https://storage.googleapis.com/r8-releases/raw/8.3.37/r8lib.jar
          test -f /opt/r8.jar
          echo "r8 ready"

      - name: Cache Kotlin compiler (Manual Build)
        if: ${{ github.event.client_payload.build_type != 'gradle' }}
        id: kotlin-cache
        uses: actions/cache@v4
        with:
          path: /opt/kotlinc
          key: kotlinc-2.1.0

      - name: Get Kotlin compiler (Manual Build)
        if: ${{ github.event.client_payload.build_type != 'gradle' && steps.kotlin-cache.outputs.cache-hit != 'true' }}
        run: |
          cd /tmp
          curl -sL -o kotlinc.zip https://github.com/JetBrains/kotlin/releases/download/v2.1.0/kotlin-compiler-2.1.0.zip
          sudo mkdir -p /opt
          sudo unzip -q kotlinc.zip -d /opt
          test -f /opt/kotlinc/bin/kotlinc
          test -f /opt/kotlinc/lib/kotlin-stdlib.jar
          echo "kotlinc ready"

      - name: Cache TG Session
        uses: actions/cache@v4
        with:
          path: /opt/tg_sessions
          key: tg-session-v2
          save-always: true

      - name: Prepare session dir
        run: |
          sudo mkdir -p /opt/tg_sessions
          sudo chown -R $(whoami) /opt/tg_sessions

      - name: Restore TG sessions from secret
        env:
          TG_SESSIONS_B64: ${{ secrets.TG_SESSIONS_B64 }}
        run: |
          python3 - <<'PYEOF'
          import os, base64, tarfile, io
          raw = os.environ.get("TG_SESSIONS_B64", "")
          if not raw:
              print("No TG_SESSIONS_B64 secret set; session will be created on first run")
          else:
              tarfile.open(fileobj=io.BytesIO(base64.b64decode(raw))).extractall("/opt/tg_sessions")
              print("Restored sessions:", sorted(os.listdir("/opt/tg_sessions")))
          PYEOF

      - name: Run APK Build worker
        env:
          TELEGRAM_BOT_TOKEN: ${{ github.event.client_payload.bot_token || secrets.TELEGRAM_BOT_TOKEN }}
          PAYLOAD_FILE_URL: ${{ github.event.client_payload.file_url }}
          PAYLOAD_TG_FILE_PATH: ${{ github.event.client_payload.tg_file_path }}
          PAYLOAD_CHAT_ID: ${{ github.event.client_payload.chat_id }}
          PAYLOAD_MESSAGE_ID: ${{ github.event.client_payload.message_id }}
          PAYLOAD_ORIGINAL_MESSAGE_ID: ${{ github.event.client_payload.original_message_id }}
          PAYLOAD_FILENAME: ${{ github.event.client_payload.filename }}
          PAYLOAD_JOB_ID: ${{ github.event.client_payload.job_id }}
          PAYLOAD_IS_ADMIN: ${{ github.event.client_payload.is_admin }}
          PAYLOAD_IS_PREMIUM: ${{ github.event.client_payload.is_premium }}
          PAYLOAD_BUILD_TYPE: ${{ github.event.client_payload.build_type }}
          PAYLOAD_REPORT_URL: ${{ github.event.client_payload.report_url }}
          PAYLOAD_FILE_ID: ${{ github.event.client_payload.file_id }}
          PAYLOAD_KEYSTORE: ${{ secrets[format('SIGNKEY_{0}', github.event.client_payload.chat_id)] }}
          PAYLOAD_SDK_ROOT: ${{ env.SDK_ROOT }}
          PAYLOAD_R8_JAR: /opt/r8.jar
          PAYLOAD_KOTLINC: /opt/kotlinc
          PAYLOAD_NDK_BIN: ${{ env.NDK_BIN }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}

        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q httpx pyrogram tgcrypto
          /tmp/venv/bin/python worker_apk_build.py

      - name: Report Failure to Telegram
        if: failure()
        env:
          BOT_TOKEN: ${{ github.event.client_payload.bot_token || secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ github.event.client_payload.chat_id }}
          MESSAGE_ID: ${{ github.event.client_payload.message_id }}
        run: |
          python3 - <<'PYEOF'
          import os, httpx
          token = os.environ.get("BOT_TOKEN")
          chat_id = os.environ.get("CHAT_ID")
          msg_id = os.environ.get("MESSAGE_ID")
          if token and chat_id and msg_id:
              try:
                  httpx.post(
                      f"https://api.telegram.org/bot{token}/editMessageText",
                      data={
                          "chat_id": chat_id,
                          "message_id": msg_id,
                          "text": "❌ <b>APK Build Failed!</b>\nWorkflow runner encountered an unexpected error during build execution.",
                          "parse_mode": "HTML"
                      },
                      timeout=10
                  )
              except Exception as e:
                  print("Failed to notify telegram:", e)
          PYEOF

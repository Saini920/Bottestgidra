name: apk-sign
run-name: job-${{ github.event.client_payload.job_id }}
on:
  repository_dispatch:
    types: [apk-sign]

permissions:
  actions: write
  contents: read

jobs:
  sign:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate apksigner (build-tools)
        run: |
          set -e
          BT=$(ls -d /usr/local/lib/android/sdk/build-tools/* 2>/dev/null | sort -V | tail -1)
          if [ -z "$BT" ] || [ ! -x "$BT/apksigner" ]; then
            echo "::error::apksigner not found on runner"
            exit 1
          fi
          echo "$BT" >> "$GITHUB_PATH"
          echo "Using build-tools: $BT"
          apksigner --version

      - name: Install worker deps
        run: npm install

      - name: Run APK Sign worker
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: node workers/apk-sign.js

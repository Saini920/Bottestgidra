name: decompile-jadx
on:
  repository_dispatch:
    types: [decompile-jadx]

permissions:
  actions: write
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get JADX
        run: |
          sudo mkdir -p /opt/jadx
          curl -L --retry 3 -o /tmp/jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.6/jadx-1.5.6.zip
          sudo unzip -q -o /tmp/jadx.zip -d /opt/jadx
          sudo chmod +x /opt/jadx/bin/jadx
          echo "/opt/jadx/bin" >> "$GITHUB_PATH"
          jadx --version

      - name: Install worker deps
        run: npm install

      - name: Run JADX worker
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: node workers/jadx.js

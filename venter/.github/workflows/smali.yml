name: decompile-smali
run-name: job-${{ github.event.client_payload.job_id }}
on:
  repository_dispatch:
    types: [decompile-smali]

permissions:
  actions: write
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Get baksmali
        run: |
          sudo curl -L --retry 3 -o /opt/baksmali.jar https://github.com/baksmali/smali/releases/download/3.0.9/baksmali-3.0.9-fat.jar
          printf '#!/bin/bash\nexec java -jar /opt/baksmali.jar "$@"\n' | sudo tee /usr/local/bin/baksmali >/dev/null
          sudo chmod +x /usr/local/bin/baksmali
          baksmali --version

      - name: Install worker deps
        run: npm install

      - name: Run Smali worker
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: node workers/smali.js

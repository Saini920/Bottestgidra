name: apk-source-build
run-name: job-${{ github.event.client_payload.job_id }}
on:
  repository_dispatch:
    types: [apk-source-build]

permissions:
  actions: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Get apktool
        run: |
          sudo curl -L --retry 3 -o /opt/apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          printf '#!/bin/bash\nexec java -jar /opt/apktool.jar "$@"\n' | sudo tee /usr/local/bin/apktool >/dev/null
          sudo chmod +x /usr/local/bin/apktool
          apktool --version

      - name: Install worker deps
        run: npm install

      - name: Run APK Build worker
        env:
          PAYLOAD: ${{ toJson(github.event.client_payload) }}
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_KEY: ${{ secrets.SESSION_KEY }}
        run: node workers/apk-build.js

# Cloudflare Pages deployment config (wrangler)
# Repo layout: frontend/ + workers/ + .github/workflows/ at repo root.
#
# Option A — dashboard (recommended):
#   Cloudflare dashboard → Pages → Create → Connect to Git
#   Root directory:     frontend
#   Build command:      npm install && npm run build
#   Build output:       dist
#
# Option B — wrangler CLI:
#   npm i -g wrangler
#   cd frontend && npm install && npm run build && cd ..
#   wrangler pages deploy frontend/dist --project-name venter

name = "venter"
compatibility_date = "2026-01-01"
pages_build_output_dir = "./frontend/dist"
